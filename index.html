<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lima Llama 🦙</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Courier New', monospace; }
    #map { width: 100%; height: 100%; }

    /* Canvas for shadow + speech bubble only */
    #overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* The llama GIF */
    #llama {
      position: absolute;
      pointer-events: none;
      z-index: 6;
      height: 130px;
      width: auto;
      display: none;
      transform-origin: bottom center;
      image-rendering: auto;
      opacity: 1;
      /* opacity driven by JS render loop – no CSS transition */
    }

    #label {
      position: absolute;
      bottom: 100px; left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 30, 0.88);
      color: #fff;
      padding: 10px 24px;
      border-radius: 28px;
      font-size: 17px;
      letter-spacing: 1px;
      z-index: 20;

      top: 16px; left: 50%;
      transform: translateX(-50%);

      letter-spacing: 3px;

      z-index: 20;
      pointer-events: none;

      position: absolute; inset: 0;
      background: rgba(10, 10, 30, 0.82);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 0.5s;
    }
    #start-screen.ready { cursor: pointer; }
    #start-screen.hidden { opacity: 0; pointer-events: none; }
    #start-screen img { height: 160px; width: auto; margin-bottom: 28px;
      filter: drop-shadow(0 4px 24px rgba(0,0,0,0.5)); }
    #start-screen h1 { color: #fff; font-size: 28px; letter-spacing: 4px;

    #progress-bar {

    #progress-fill {

    #fullscreen-btn {
      position: absolute;

    /* Zeitleiste */
    #timeline {
      position: absolute;
      left: 50%; bottom: 44px;   /* Abstand zu Mapbox-Logo und Attribution */
      transform: translateX(-50%);

      opacity: 0;

    #tl-track {
      position: absolute; left: 0; right: 0; bottom: 6px;

      background: rgba(10,10,30,0.45);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.25);

    #tl-fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 0; border-radius: 2px;

    .tl-tick {

      text-shadow: 0 0 4px rgba(255,255,255,0.9);
    }
    #tl-start { left: 0; transform: translateX(-50%); }
    #tl-stop  { right: 0; transform: translateX(50%); }
    #tl-marker {
      position: absolute; bottom: 14px;
      transform: translateX(-50%);
      background: rgba(10,10,30,0.88); color: #fff;
      font-size: 12px; letter-spacing: 1px;
      padding: 2px 8px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* Kiosk-Modus (?kiosk) */
    body.kiosk, body.kiosk * { cursor: none !important; }
    body.kiosk #fullscreen-btn { display: none; }
  </style>

<script>
// ═══════════════════════════════════════════════════════════════
// MAPBOX
// ═══════════════════════════════════════════════════════════════
mapboxgl.accessToken = 'pk.eyJ1IjoiYWxleGFuZGVyaHViZXJub3dhayIsImEiOiJjbXEyMndyZDYwd3VxMnBwZ2p3aTlpdnRoIn0.UlTEH_bNGLkG6AXjj2N-SQ';

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/outdoors-v12',
  center: [-65, -15],
  zoom: 3,
  projection: 'mercator',
  interactive: false
});

// ═══════════════════════════════════════════════════════════════
// CANVAS (shadow + speech bubble only)
// ═══════════════════════════════════════════════════════════════
const overlay = document.getElementById('overlay');
const ctx     = overlay.getContext('2d');
const llamaEl = document.getElementById('llama');

// Fallback, falls das extern gehostete GIF nicht mehr erreichbar ist
const LLAMA_FALLBACK = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="378" height="498" viewBox="0 0 378 498">' +
  '<text x="189" y="420" font-size="360" text-anchor="middle">🦙</text></svg>');
document.querySelectorAll('.llama-img').forEach(img => {
  img.addEventListener('error', () => {
    if (img.src !== LLAMA_FALLBACK) img.src = LLAMA_FALLBACK;
  });
});

function resizeOverlay() {
  const dpr = window.devicePixelRatio || 1;
  overlay.width  = window.innerWidth  * dpr;
  overlay.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeOverlay();
window.addEventListener('resize', resizeOverlay);

// ═══════════════════════════════════════════════════════════════
// SPIEL-UHR
// Alle Zeitabläufe laufen über diese Uhr. Sie wird nur im Render-Loop
// weitergezählt, steht also still, solange der Tab im Hintergrund ist.
// So bleiben Animation, Timer und Ton synchron.
// ═══════════════════════════════════════════════════════════════
let clock = 0;
let timers = [];

function after(ms, fn) { timers.push({ at: clock + ms, fn }); }

function runTimers() {
  const due = timers.filter(t => t.at <= clock);
  if (!due.length) return;
  timers = timers.filter(t => t.at > clock);
  due.forEach(t => t.fn());
}

// ═══════════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════════
let audioCtx = null;
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

const MELODY = [523.25, 659.25, 783.99, 880, 1046.5, 880, 783.99, 659.25, 523.25, 392, 440, 523.25];
const NOTE_INTERVAL = 420;
let melodyIdx    = 0;
let melodyActive = false;

function playNote(freq) {
  const a   = ac();
  const dur = 0.55;
  const vol = 0.005;

  // Vibrato LFO
  const lfo  = a.createOscillator();
  const lfoG = a.createGain();
  lfo.frequency.value = 5.5;
  lfoG.gain.value = 4; // ±4 Hz vibrato depth
  lfo.connect(lfoG);

  const osc  = a.createOscillator();
  const gain = a.createGain();
  lfoG.connect(osc.frequency);
  osc.connect(gain);
  gain.connect(a.destination);

  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, a.currentTime);
  // Soft attack, long sustain, fade out
  gain.gain.setValueAtTime(0, a.currentTime);
  gain.gain.linearRampToValueAtTime(vol, a.currentTime + 0.08);
  gain.gain.setValueAtTime(vol, a.currentTime + dur - 0.1);
  gain.gain.linearRampToValueAtTime(0, a.currentTime + dur);

  lfo.start(a.currentTime);
  osc.start(a.currentTime);
  lfo.stop(a.currentTime + dur + 0.01);
  osc.stop(a.currentTime + dur + 0.01);
}

function melodyTick() {
  if (!melodyActive) return;
  playNote(MELODY[melodyIdx % MELODY.length]);
  melodyIdx++;
  after(NOTE_INTERVAL, melodyTick);
}

function startMelody() {
  if (melodyActive) return;
  melodyActive = true;
  after(NOTE_INTERVAL, melodyTick);
  hummingAudio.currentTime = 0;
  hummingAudio.play().catch(() => {});
}

function stopMelody() {
  melodyActive = false;
  hummingAudio.pause();
}

const screamAudio  = new Audio('166625__jzazvurek__childs-scream-8.wav');
const hummingAudio = new Audio('humming.m4a');
hummingAudio.loop  = true;
const bellAudio    = new Audio('bell.mp3');
bellAudio.volume   = 0.1;
const ALL_AUDIO    = [screamAudio, hummingAudio, bellAudio];

function playScream() {
  screamAudio.currentTime = 0;
  screamAudio.play().catch(() => {});
}

function playBell() {
  bellAudio.currentTime = 0;
  bellAudio.play().catch(() => {});
}

function preloadAudio(a) {
  return new Promise(resolve => {
    if (a.readyState >= 4) return resolve();
    const t = setTimeout(resolve, 5000); // nicht ewig warten
    a.addEventListener('canplaythrough', () => { clearTimeout(t); resolve(); }, { once: true });
    a.addEventListener('error',          () => { clearTimeout(t); resolve(); }, { once: true });
    a.preload = 'auto';
    a.load();
  });
}

// Tab im Hintergrund: Ton anhalten, beim Zurückkehren fortsetzen
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    ALL_AUDIO.forEach(a => a.pause());
    if (audioCtx) audioCtx.suspend();
  } else {
    if (audioCtx) audioCtx.resume();
    if (melodyActive) hummingAudio.play().catch(() => {});
  }
});

// ═══════════════════════════════════════════════════════════════
// LOCATIONS
// ═══════════════════════════════════════════════════════════════
let locations = [];
let locIdx    = 0;

async function loadLocations() {
  const res = await fetch('locations.json');
  locations = await res.json();
}

function labelText(loc) {
  let t = '📍 ' + loc.name;
  if (loc.year)   t += ', ' + loc.year;
  if (loc.reason) t += ' – ' + loc.reason;
  return t;
}

// ═══════════════════════════════════════════════════════════════
// ANIMATION STATE
// ═══════════════════════════════════════════════════════════════
const PHASE = { IDLE: 0, HOPPING: 1, SCREAMING: 2 };

let phase       = PHASE.IDLE;
let facingRight = true;

let hopStart    = 0, hopDur = 0;
let hopPath     = [];
let hopSamePlace = false;
let hopZoomFrom = 5, hopZoomTo  = 5;
const ARC_H     = 100;
const HOP_ZOOM_DUR = 600;
const SAME_PLACE_HOP_DUR = 1500;

const SCREAM_DUR = 3200;

let bubbleText   = '';
let bubbleTgt    = 'AAAAAAH!';
let bubbleTimer  = 0;

let scrX = 0, scrY = 0;

let showCross = false;
let crossX = 0, crossY = 0;

// JS-driven fade (keeps llama, shadow and bubble perfectly in sync)
let llamaFadeAlpha = 1;
let fadeOutActive  = false;
let fadeInActive   = false;
let fadeStartTime  = 0;
const FADE_OUT_DUR = 1000;
const FADE_IN_DUR  = 900;

const label = document.getElementById('label');
let labelHideAt = 0;

function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { return t * t * (3 - 2 * t); }

// ── Großkreis (Flugbogen) ─────────────────────────────────────
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const PATH_STEPS = 96;

function toVec(lng, lat) {
  const a = lng * D2R, b = lat * D2R;
  return [Math.cos(b) * Math.cos(a), Math.cos(b) * Math.sin(a), Math.sin(b)];
}

// Punkte entlang des Großkreises von → nach, Längengrade fortlaufend
// (ohne Sprung an der Datumsgrenze)
function greatCirclePath(from, to) {
  const v1 = toVec(from.lng, from.lat), v2 = toVec(to.lng, to.lat);
  const dot = Math.max(-1, Math.min(1, v1[0]*v2[0] + v1[1]*v2[1] + v1[2]*v2[2]));
  const omega = Math.acos(dot);
  const pts = [];
  let prevLng = from.lng;
  for (let i = 0; i <= PATH_STEPS; i++) {
    const t = i / PATH_STEPS;
    let lng, lat;
    if (omega < 1e-6) {
      lng = lerp(from.lng, to.lng, t); lat = lerp(from.lat, to.lat, t);
    } else {
      const s  = Math.sin(omega);
      const w1 = Math.sin((1 - t) * omega) / s, w2 = Math.sin(t * omega) / s;
      const x = w1*v1[0] + w2*v2[0], y = w1*v1[1] + w2*v2[1], z = w1*v1[2] + w2*v2[2];
      lng = Math.atan2(y, x) * R2D;
      lat = Math.asin(Math.max(-1, Math.min(1, z))) * R2D;
    }
    while (lng - prevLng >  180) lng -= 360;
    while (lng - prevLng < -180) lng += 360;
    prevLng = lng;
    pts.push([lng, lat]);
  }
  return pts;
}

// Position auf dem Pfad bei t (0..1)
function pointOnPath(pts, t) {
  const f = t * (pts.length - 1);
  const i = Math.min(Math.floor(f), pts.length - 2);
  const k = f - i;
  return [lerp(pts[i][0], pts[i+1][0], k), lerp(pts[i][1], pts[i+1][1], k)];
}

// ── Zeitleiste ────────────────────────────────────────────────
const tlEl     = document.getElementById('timeline');
const tlFill   = document.getElementById('tl-fill');
const tlMarker = document.getElementById('tl-marker');
let tlMin = 0, tlMax = 1, tlTicks = [], tlLastIdx = -1;

function yearOf(loc) { return parseInt(loc.year, 10) || 0; }
function tlPos(year) { return (year - tlMin) / Math.max(1, tlMax - tlMin) * 100; }

function buildTimeline() {
  const years = locations.map(yearOf);
  tlMin = Math.min(...years);
  tlMax = Math.max(...years);
  document.getElementById('tl-start').textContent = tlMin;
  document.getElementById('tl-stop').textContent  = tlMax;
  const box = document.getElementById('tl-ticks');
  tlTicks = years.map(y => {
    const d = document.createElement('div');
    d.className = 'tl-tick';
    d.style.left = tlPos(y) + '%';
    box.appendChild(d);
    return d;
  });
}

// year: aktuelle (ggf. gebrochene) Jahreszahl, idx: zuletzt erreichte Station
function updateTimeline(year, idx) {
  const p = tlPos(year) + '%';
  tlFill.style.width   = p;
  tlMarker.style.left  = p;
  tlMarker.textContent = Math.round(year);
  if (idx !== tlLastIdx) {
    tlTicks.forEach((d, i) => d.classList.toggle('passed', i <= idx));
    tlLastIdx = idx;
  }
}

// ── Routen-Spur ───────────────────────────────────────────────
let trailDone = [];   // abgeschlossene Sprünge (je ein Koordinaten-Array)

function setTrail(partial) {
  const src = map.getSource('trail');
  if (!src) return;
  const lines = partial && partial.length > 1 ? trailDone.concat([partial]) : trailDone;
  src.setData({
    type: 'FeatureCollection',
    features: lines.map(c => ({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: c } }))
  });
}

function addTrailLayer() {
  map.addSource('trail', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: 'trail',
    type: 'line',
    source: 'trail',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: {
      'line-color': '#B71C1C',
      'line-width': 2.5,
      'line-opacity': 0.75,
      'line-dasharray': [1.5, 1.5]
    }
  });
}
function project(lng, lat) { const p = map.project([lng, lat]); return [p.x, p.y]; }

function showLabel(loc) {
  label.textContent = labelText(loc);
  label.classList.add('show');
  const hideAt = labelHideAt = clock + 3500;
  after(3500, () => { if (labelHideAt === hideAt) label.classList.remove('show'); });
}

function startScream(loc) {
  phase       = PHASE.SCREAMING;
  bubbleText  = '';
  bubbleTgt   = loc.year || 'AAAAAAH!';
  bubbleTimer = 0;
  showLabel(loc);
}

// ── hop ────────────────────────────────────────────────────────
function startHop() {
  if (locations.length < 2) return;
  const from = locations[locIdx];
  const to   = locations[(locIdx + 1) % locations.length];

  hopPath = greatCirclePath(from, to);

  const dlng = to.lng - from.lng, dlat = to.lat - from.lat;
  const dist = Math.sqrt(dlng*dlng + dlat*dlat);
  const samePlace = hopSamePlace = dist < 0.01;

  // Blickrichtung nur ändern, wenn es wirklich nach links/rechts geht
  if (!samePlace) facingRight = to.lng >= from.lng;

  // Zoom so the jump distance fits comfortably on screen. Der Zoom wird
  // im Render-Loop zusammen mit dem Mittelpunkt gesetzt (jumpTo), weil ein
  // separates easeTo() durch das Mitführen der Karte sofort abbrechen würde.
  hopZoomFrom = map.getZoom();
  hopZoomTo   = samePlace
    ? hopZoomFrom                     // Hüpfer auf der Stelle: kein Zoom-Ruck
    : Math.max(2, Math.min(8, Math.log2(400 / dist)));

  hopDur = samePlace
    ? SAME_PLACE_HOP_DUR
    : Math.min(6000, Math.max(2000, dist * 85));

  hopStart = clock;
  phase    = PHASE.HOPPING;
  startMelody();
}

function onArrival() {
  locIdx = (locIdx + 1) % locations.length;
  stopMelody();
  if (!hopSamePlace) trailDone.push(hopPath);
  setTrail();

  const loc    = locations[locIdx];
  const isLast = locIdx === locations.length - 1;

  startScream(loc);
  map.flyTo({ center: [loc.lng, loc.lat], zoom: 5, duration: 1000, essential: true });

  if (isLast) {
    // Finale: bell toll, llama fades, cross appears, 5s pause, restart
    playBell();

    // After bubble types in (~1.5s): start JS-driven fade + show cross
    after(1500, () => {
      crossX = scrX;
      crossY = scrY;
      showCross     = true;
      fadeOutActive = true;
      fadeInActive  = false;
      fadeStartTime = clock;
    });

    // After fade (1s) + 5s pause → restart at first location
    after(1500 + FADE_OUT_DUR + 5000, () => {
      showCross      = false;
      phase          = PHASE.IDLE;
      bubbleText     = '';
      locIdx         = 0;
      llamaFadeAlpha = 0;
      fadeOutActive  = false;
      trailDone      = [];
      setTrail();
      const first = locations[0];
      map.flyTo({ center: [first.lng, first.lat], zoom: 5, duration: 1200, essential: true });
      after(1200, () => {
        fadeInActive  = true;
        fadeStartTime = clock;
        after(FADE_IN_DUR + 300, showFirstArrival);
      });
    });

  } else {
    playScream();
    after(SCREAM_DUR + 200, () => { phase = PHASE.IDLE; startHop(); });
  }
}

// ═══════════════════════════════════════════════════════════════
// GRAVE CROSS
// ═══════════════════════════════════════════════════════════════
function drawGraveCross(ctx, cx, cy, alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;

  const vw   = 13;          // vertical bar width
  const hh   = 12;          // horizontal bar height
  const top  = cy - 60;     // top of vertical bar
  const bot  = cy + 2;      // bottom of vertical bar
  const armL = cx - 30;     // left end of crossbar
  const armR = cx + 30;     // right end of crossbar
  const armT = cy - 38;     // top of crossbar
  const armB = armT + hh;
  const r    = 5;            // corner radius

  function rrect(x, y, w, h) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y,     x + w, y + r,     r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  // Dirt mound
  const dirtG = ctx.createRadialGradient(cx, cy, 2, cx, cy + 4, 30);
  dirtG.addColorStop(0, '#b8884a');
  dirtG.addColorStop(1, '#6b4e22');
  ctx.fillStyle = dirtG;
  ctx.beginPath();
  ctx.ellipse(cx, cy + 7, 30, 11, 0, 0, Math.PI * 2);
  ctx.fill();

  // Cast shadow (darkened ellipse, offset)
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(cx + 8, cy + 14, 24, 6, -0.15, 0, Math.PI * 2);
  ctx.fill();

  // Wood gradient (left→right gives cylindrical look on vertical bar)
  const woodG = ctx.createLinearGradient(cx - vw / 2, 0, cx + vw / 2, 0);
  woodG.addColorStop(0,    '#5a2a08');
  woodG.addColorStop(0.18, '#a04e1a');
  woodG.addColorStop(0.45, '#d07838');
  woodG.addColorStop(0.75, '#9a4c18');
  woodG.addColorStop(1,    '#4a2005');

  // Horizontal bar uses top→bottom gradient
  const hGrad = ctx.createLinearGradient(0, armT, 0, armB);
  hGrad.addColorStop(0,   '#c87030');
  hGrad.addColorStop(0.5, '#a05020');
  hGrad.addColorStop(1,   '#5c2a08');

  // Draw vertical bar
  rrect(cx - vw / 2, top, vw, bot - top);
  ctx.fillStyle   = woodG;
  ctx.fill();
  ctx.strokeStyle = '#2e1204';
  ctx.lineWidth   = 1.5;
  ctx.stroke();

  // Draw horizontal bar (on top)
  rrect(armL, armT, armR - armL, hh);
  ctx.fillStyle   = hGrad;
  ctx.fill();
  ctx.strokeStyle = '#2e1204';
  ctx.lineWidth   = 1.5;
  ctx.stroke();

  // Left-edge highlight on vertical bar → gives 3-D depth
  ctx.strokeStyle = 'rgba(255,195,110,0.38)';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - vw / 2 + 3, bot - 5);
  ctx.lineTo(cx - vw / 2 + 3, armB + 1);
  ctx.moveTo(cx - vw / 2 + 3, armT - 1);
  ctx.lineTo(cx - vw / 2 + 3, top + 7);
  ctx.stroke();

  // Top highlight on horizontal bar
  ctx.beginPath();
  ctx.moveTo(armL + 5, armT + 3);
  ctx.lineTo(armR - 5, armT + 3);
  ctx.stroke();

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
// RENDER LOOP
// ═══════════════════════════════════════════════════════════════
let lastT = null;
const MAX_FRAME_DT = 100; // nach Tab-Wechsel nicht vorspringen

// Llama image dimensions (GIF: 378x498, displayed at height=130px)
const LLAMA_H  = 130;
const LLAMA_W  = Math.round(130 * 378 / 498); // ≈ 99px

function render(now) {
  requestAnimationFrame(render);
  const dt = lastT === null ? 0 : Math.min(now - lastT, MAX_FRAME_DT);
  lastT = now;
  clock += dt;
  runTimers();

  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  if (!started || !locations.length || !map.isStyleLoaded()) return;

  let shake = 0;

  if (phase === PHASE.HOPPING) {
    const t = Math.min((clock - hopStart) / hopDur, 1);
    const [lng, lat] = pointOnPath(hopPath, t);
    if (!hopSamePlace) {
      const n = Math.floor(t * (hopPath.length - 1));
      setTrail(hopPath.slice(0, n + 1).concat([[lng, lat]]));
    }
    const zt  = smooth(Math.min((clock - hopStart) / HOP_ZOOM_DUR, 1));
    // Follow the llama – Mittelpunkt und Zoom in einem Schritt setzen
    map.jumpTo({ center: [lng, lat], zoom: lerp(hopZoomFrom, hopZoomTo, zt) });
    const [sx, sy] = project(lng, lat);
    scrX = sx;
    scrY = sy - Math.sin(Math.PI * t) * ARC_H;
    const nextLoc = locations[(locIdx + 1) % locations.length];
    updateTimeline(lerp(yearOf(locations[locIdx]), yearOf(nextLoc), t), locIdx);
    if (t >= 1) onArrival();

  } else if (phase === PHASE.SCREAMING) {
    const loc = locations[locIdx];
    [scrX, scrY] = project(loc.lng, loc.lat);
    shake = showCross ? 0 : 4;  // no shake once cross is showing
    bubbleTimer += dt;
    if (bubbleTimer > 80 && bubbleText.length < bubbleTgt.length) {
      bubbleText += bubbleTgt[bubbleText.length];
      bubbleTimer = 0;
    }

  } else {
    const loc = locations[locIdx];
    [scrX, scrY] = project(loc.lng, loc.lat);
  }

  if (phase !== PHASE.HOPPING) updateTimeline(yearOf(locations[locIdx]), locIdx);

  // ── JS-driven fade ────────────────────────────────────────────
  if (fadeOutActive) {
    llamaFadeAlpha = Math.max(0, 1 - (clock - fadeStartTime) / FADE_OUT_DUR);
    if (llamaFadeAlpha === 0) fadeOutActive = false;
  } else if (fadeInActive) {
    llamaFadeAlpha = Math.min(1, (clock - fadeStartTime) / FADE_IN_DUR);
    if (llamaFadeAlpha === 1) fadeInActive = false;
  }
  llamaEl.style.opacity = llamaFadeAlpha;

  // Grabkreuz im Finale
  if (showCross) {
    const [cx, cy] = project(locations[locIdx].lng, locations[locIdx].lat);
    drawGraveCross(ctx, cx, cy, 1 - llamaFadeAlpha);
  }

  // Random shake offset
  const ox = shake ? (Math.random() - 0.5) * shake * 2 : 0;
  const oy = shake ? (Math.random() - 0.5) * shake     : 0;

  // Position llama GIF
  // Anchor: bottom-center of image = feet at (scrX, scrY)
  llamaEl.style.left      = (scrX - LLAMA_W / 2 + ox) + 'px';
  llamaEl.style.top       = (scrY - LLAMA_H + oy) + 'px';
  llamaEl.style.transform = `scaleX(${facingRight ? -1 : 1})`;
  llamaEl.style.display   = 'block';

  // Shadow ellipse (canvas) – perfectly synced via llamaFadeAlpha
  ctx.save();
  ctx.globalAlpha = 0.25 * llamaFadeAlpha;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(scrX + ox * 0.5, scrY + 3, 28, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Speech bubble during scream – fades with llama
  if (phase === PHASE.SCREAMING && bubbleText.length > 0 && llamaFadeAlpha > 0.05) {
    // Head is roughly at top-center of the GIF
    const dir  = facingRight ? 1 : -1;
    const headX = scrX + dir * 38;
    const headY = scrY - LLAMA_H + 28;  // top area of GIF

    const bw = bubbleText.length * 11 + 24;
    const bh = 32;
    const bx = headX + dir * 10;
    const by = headY - bh - 8;

    ctx.save();
    ctx.globalAlpha = llamaFadeAlpha;

    const r    = 8;                                      // corner radius
    const tailBX = facingRight ? bx + 14 : bx + bw - 22;
    const tx1  = tailBX, tx2 = tailBX + 7, tx3 = tailBX + 14;
    const ty   = by + bh, tipY = by + bh + 10;

    // Single path: rounded rect + tail as one shape → one stroke, no seam
    ctx.beginPath();
    ctx.moveTo(bx + r, by);
    ctx.lineTo(bx + bw - r, by);
    ctx.arcTo(bx + bw, by,     bx + bw, by + r,     r);
    ctx.lineTo(bx + bw, by + bh - r);
    ctx.arcTo(bx + bw, by + bh, bx + bw - r, by + bh, r);
    ctx.lineTo(tx3, ty);
    ctx.lineTo(tx2, tipY);   // tail tip
    ctx.lineTo(tx1, ty);
    ctx.lineTo(bx + r, by + bh);
    ctx.arcTo(bx, by + bh, bx, by + bh - r, r);
    ctx.lineTo(bx, by + r);
    ctx.arcTo(bx, by, bx + r, by, r);
    ctx.closePath();

    ctx.fillStyle   = '#FFFDE4';
    ctx.strokeStyle = '#444';
    ctx.lineWidth   = 2;
    ctx.fill();
    ctx.stroke();

    // Text
    ctx.fillStyle = '#B71C1C';
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.fillText(bubbleText, bx + 12, by + 21);

    ctx.restore();
  }
}

requestAnimationFrame(render);

// ═══════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════
const startScreen  = document.getElementById('start-screen');
const startHint    = document.getElementById('start-hint');
const progressFill = document.getElementById('progress-fill');
let preloadDone    = false;
let started        = false;

// Show arrival sequence at the very first location (loc[0]) before any hop
function showFirstArrival() {
  locIdx = 0;
  const loc = locations[0];
  [scrX, scrY] = project(loc.lng, loc.lat);
  startScream(loc);
  playScream();
  map.flyTo({ center: [loc.lng, loc.lat], zoom: 5, duration: 800, essential: true });
  after(SCREAM_DUR + 200, () => { phase = PHASE.IDLE; startHop(); });
}

// ── Kiosk-Modus & Wake Lock ───────────────────────────────────
// ?kiosk in der URL: startet ohne Klick und blendet Mauszeiger und
// Vollbild-Knopf aus. Ton ohne Klick erlaubt der Browser nur mit
// entsprechender Einstellung (siehe README).
const KIOSK = new URLSearchParams(location.search).has('kiosk');
if (KIOSK) document.body.classList.add('kiosk');

let wakeLock = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator) || document.hidden) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { /* nicht erlaubt oder nicht unterstützt */ }
}
// Der Browser gibt den Wake Lock beim Tab-Wechsel frei → neu anfordern
document.addEventListener('visibilitychange', () => {
  if (started && !document.hidden && !wakeLock) requestWakeLock();
});

function startShow() {
  if (!preloadDone || started) return; // ignore clicks while loading
  started = true;
  ac().resume();
  requestWakeLock();
  startScreen.classList.add('hidden');
  setTimeout(() => { startScreen.style.display = 'none'; }, 500);
  tlEl.classList.add('show');
  showFirstArrival(); // start at loc[0] with scream, then hop to loc[1]
}

startScreen.addEventListener('click', startShow);

// Visit every location silently to warm up the tile cache
async function preloadTiles() {
  function waitIdle() {
    return new Promise(resolve => {
      const t = setTimeout(resolve, 1500); // max wait per location
      map.once('idle', () => { clearTimeout(t); resolve(); });
    });
  }

  const audioReady = Promise.all(ALL_AUDIO.map(preloadAudio));

  for (let i = 0; i < locations.length; i++) {
    const loc = locations[i];
    map.jumpTo({ center: [loc.lng, loc.lat], zoom: 5 });
    await waitIdle();
    progressFill.style.width = ((i + 1) / locations.length * 100) + '%';
  }

  // Return to first location
  map.jumpTo({ center: [locations[0].lng, locations[0].lat], zoom: 4 });
  [scrX, scrY] = project(locations[0].lng, locations[0].lat);
  await waitIdle();
  await audioReady;

  preloadDone = true;
  startHint.textContent = 'Klicken zum Starten';
  startHint.classList.add('ready');
  document.getElementById('progress-bar').classList.add('done');
  startScreen.classList.add('ready');
  if (KIOSK) startShow();
}

// Fullscreen
const fsBtn = document.getElementById('fullscreen-btn');
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
});
document.addEventListener('fullscreenchange', () => {
  const fs = !!document.fullscreenElement;
  fsBtn.textContent = fs ? '✕' : '⛶';
  fsBtn.title       = fs ? 'Vollbild beenden' : 'Vollbild';
});

map.on('load', async () => {
  try {
    await loadLocations();
  } catch (e) {
    startHint.textContent = 'locations.json konnte nicht geladen werden (lokalen Server benutzen, siehe README)';
    return;
  }
  if (!locations.length) return;
  addTrailLayer();
  buildTimeline();
  preloadTiles();
});
</script>
